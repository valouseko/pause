name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK_URL: https://github.com/valouseko/pause/releases/latest/download/Pause.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        run: |
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode signing keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pause-release.p12"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Grant execute on gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: android
        env:
          STORE_FILE: ${{ runner.temp }}/pause-release.p12
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 tests/check_strings.py
          ./gradlew assembleRelease --stacktrace

      - name: Release build memory before emulator tests
        working-directory: android
        run: ./gradlew --stop

      - name: Download previous release for upgrade test
        run: curl --fail --location "$APK_URL" --output previous.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify language and upgrades on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: python3 android/tests/language_smoke.py

      - name: Verify language and upgrades on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: python3 android/tests/language_smoke.py

      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-verification
          path: android/test-results/

      - name: Prepare release assets
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Pause.apk
          NOTES="$(cat android/RELEASE_NOTES.txt)"
          NOTES_EN="$(cat android/RELEASE_NOTES_EN.txt)"
          jq -n \
            --argjson vc ${VERSION_CODE} \
            --arg vn "${VERSION_NAME}" \
            --arg url "${APK_URL}" \
            --arg notes "$NOTES" \
            --arg notesEn "$NOTES_EN" \
            '{versionCode:$vc, versionName:$vn, notes:$notes, notesEn:$notesEn, apkUrl:$url}' \
            > version.json
          echo "APK:"; ls -la Pause.apk; echo "version.json:"; cat version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pause-apk
          path: Pause.apk

      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pause - poslední build
          body: |
            Nejnovější APK appky Pause (verze ${{ env.VERSION_NAME }}).
            Stáhni Pause.apk do telefonu a nainstaluj. Update pak řeší appka sama.
          files: |
            Pause.apk
            version.json
          make_latest: true

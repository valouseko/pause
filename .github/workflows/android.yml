name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK_URL: https://github.com/valouseko/pause/releases/latest/download/Pause.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        run: |
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode signing keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pause-release.p12"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Grant execute on gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: android
        env:
          STORE_FILE: ${{ runner.temp }}/pause-release.p12
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare release assets
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Pause.apk
          jq -n \
            --argjson vc ${VERSION_CODE} \
            --arg vn "${VERSION_NAME}" \
            --arg url "${APK_URL}" \
            '{versionCode:$vc, versionName:$vn, notes:"Nová verze Pause. Data i oprávnění zůstávají.", apkUrl:$url}' \
            > version.json
          echo "APK:"; ls -la Pause.apk; echo "version.json:"; cat version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pause-apk
          path: Pause.apk

      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pause - poslední build
          body: |
            Nejnovější APK appky Pause (verze ${{ env.VERSION_NAME }}).
            Stáhni Pause.apk do telefonu a nainstaluj. Update pak řeší appka sama.
          files: |
            Pause.apk
            version.json
          make_latest: true

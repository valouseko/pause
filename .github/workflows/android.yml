name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute on gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mezera.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mezera-apk
          path: Mezera.apk

      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mezera - poslední build
          body: |
            Nejnovější APK Mezery. Stáhni `Mezera.apk` do telefonu a nainstaluj
            (povol instalaci z neznámých zdrojů). Pak v appce zapni Přístupnost a Překrytí.
          files: Mezera.apk
          make_latest: true
